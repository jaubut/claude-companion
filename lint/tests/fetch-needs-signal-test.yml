id: fetch-needs-signal
valid:
  - 'await fetch(url, { signal: AbortSignal.timeout(5000) })'
  - 'await fetch(url, { signal })'
  - 'await fetch(url, init)'
  - 'await fetch(url, { ...init, method: "POST" })'
  - 'await safeFetch(url, { headers, signal: ctrl.signal })'
  - 'const f = deps.fetch(url)'
invalid:
  - 'await fetch(url)'
  - 'await fetch(url, { method: "POST" })'
  - 'await safeFetch(info.videoUrl, { headers })'
