<!doctype html>
<!-- Behance project page as link-media-browser.ts serialises it (data-media-w stamped). Modeled on
     Behance's project_modules markup, not a live capture (plain HTTP gets a 403 here). -->
<html><head>
<title>Brand Identity :: Behance</title>
<meta property="og:title" content="Brand Identity">
<meta property="og:description" content="Identity system for a coffee roaster.">
<meta property="og:image" content="https://mir-s3-cdn-cf.behance.net/projects/max_808/218164889.Y3JvcCwxMDA.png">
<meta property="og:site_name" content="Behance">
</head><body>
<img class="avatar" src="https://mir-s3-cdn-cf.behance.net/user/50/12345.png" data-media-w="32">
<div class="project-modules">
  <div class="ImageElement-root"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/max_1200/aaa111.png"
    srcset="https://mir-s3-cdn-cf.behance.net/project_modules/max_632/aaa111.png 632w,https://mir-s3-cdn-cf.behance.net/project_modules/max_1200/aaa111.png 1200w,https://mir-s3-cdn-cf.behance.net/project_modules/max_3840/aaa111.png 3840w"
    data-media-w="1400"></div>
  <picture>
    <source type="image/webp" srcset="https://mir-s3-cdn-cf.behance.net/project_modules/max_1200_webp/bbb222.png 1200w, https://mir-s3-cdn-cf.behance.net/project_modules/2800_webp/bbb222.png 2800w">
    <img src="https://mir-s3-cdn-cf.behance.net/project_modules/max_1200/bbb222.png" data-media-w="1400">
  </picture>
  <div class="grid-row">
    <img src="https://mir-s3-cdn-cf.behance.net/project_modules/disp/ccc333.jpg" data-media-w="690">
    <img src="https://mir-s3-cdn-cf.behance.net/project_modules/disp/ddd444.jpg" data-media-w="690">
  </div>
</div>
<section class="more-projects">
  <img src="https://mir-s3-cdn-cf.behance.net/projects/404/999888.Y3JvcCw.png" data-media-w="300">
</section>
</body></html>
